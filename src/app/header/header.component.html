      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

          </li>
          <li class="nav-item dropdown" *ngIf="userRole==!'ADMIN' && userRole==!'OPERATOR'">

            </a>

              <li *ngFor="let category of categoriesBoy">
                <a class="dropdown-item" href="/{{ category.route }}">{{ category.name }}</a>
              </li>
              <!-- <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" [routerLink]="allCategory.route">{{ allCategory.name }}</a>
              </li> -->

          </li>

            </a>
            <ul class="dropdown-menu">
              <li *ngFor="let category of categoriesGirl">
                <a class="dropdown-item" href="/{{ category.route }}">{{ category.name }}</a>
              </li>

              <li>
                <a class="dropdown-item" [routerLink]="allCategory.route">{{ allCategory.name }}</a>
              </li> -->

          </li>

        <ul class="navbar-nav ms-auto">
          <li class="nav-item dropdown me-3">

              <ul class="dropdown-menu">
                <li>
                  <a *ngIf="userRole=='ADMIN' "  class="dropdown-item" href="/checkout/direct">Caisse</a>
                </li>
                <li>
                  <a *ngIf="userRole=='ADMIN' "  class="dropdown-item" href="/catalog">Catalogue</a>

                <li>

                </li>
                <li>
                  <a *ngIf="userRole=='ADMIN' "  class="dropdown-item" href="/orderList">Liste Commandes</a>
                </li>
                <li>
                  <a class="dropdown-item"  href="javascript:void(0)" (click)="logout()">Déconnexion</a>
                </li>

              <a *ngIf="user==''" class="nav-link" routerLink="/login">Connexion</a>
          </li>
