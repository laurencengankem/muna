
  <div class="container">
    <form [formGroup]="clothProductForm" (ngSubmit)="saveProduct()" class="container mt-4">

        <div class="row">

            <div class="col-md-4 mb-3">
              <label for="code" class="form-label">Code Modèle</label>
              <input 
              formControlName="code" 
              id="code" 
              type="text" 
              class="form-control" 
              placeholder="Enter Code Modèle">
            </div>

            <div class="col-md-4 mb-3">
                <label for="name" class="form-label">Nom De L'Article</label>
                <input 
                formControlName="name" 
                id="name" 
                type="text" 
                class="form-control" 
                placeholder="Enter Product Name">
                <div *ngIf="clothProductForm.get('name')?.invalid && clothProductForm.get('name')?.touched" class="text-danger">
                    Nom obligatoire
                </div>
            </div>
      
            <div class="col-md-4 mb-3">
                <label for="brand" class="form-label">Marque</label>
                <input 
                formControlName="brand" 
                id="brand" 
                type="text" 
                class="form-control" 
                placeholder="Enter Product Brand">
            </div>

            

        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description De L'Article</label>
          <textarea 
            formControlName="description" 
            id="description" 
            class="form-control" 
            placeholder="Enter product description"></textarea>
          <div *ngIf="clothProductForm.get('description')?.invalid && clothProductForm.get('description')?.touched" class="text-danger">
            Description obligatoire
          </div>
        </div>

      
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="discount" class="form-label">Reduction (%)</label>
            <input 
              formControlName="discount" 
              id="discount" 
              type="number" 
              class="form-control" 
              placeholder="Enter discount percentage">
            <div *ngIf="clothProductForm.get('discount')?.invalid && clothProductForm.get('discount')?.touched" class="text-danger">
              Entre 0 et 100
            </div>
          </div>
      
          <div class="col-md-6 mb-3">
            <label for="sex" class="form-label">Sexe</label>
            <select formControlName="sex" id="sex" class="form-select">
              <option value="MALE">Garçon</option>
              <option value="FEMALE">Fille</option>
              <option value="UNISEX">Unisex</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="category" class="form-label">Categorie</label>
            <input 
              formControlName="category" 
              id="category" 
              type="text" 
              class="form-control" 
              placeholder="Entrer la Categorie">
          </div>

          <div class="col-md-6">
            <label for="location" class="form-label">Emplacement</label>
            <input 
              formControlName="location" 
              id="locqtion" 
              type="text" 
              class="form-control" 
              placeholder="Entrer l'Emplacement">
          </div>

        </div>
      
        

        
      
        <div class="mb-3">
          <label for="sizes" class="form-label">Sizes</label>
          <div formArrayName="sizes">
            <div *ngFor="let size of sizes.controls; let i = index" class="row mb-2">
              <div [formGroupName]="i" class="col-md-3">
                <input 
                  formControlName="name" 
                  type="text" 
                  class="form-control" 
                  placeholder="Size (e.g. S, M, L)">
              </div>
              <div [formGroupName]="i" class="col-md-3">
                <input 
                  formControlName="quantity" 
                  type="number" 
                  class="form-control" 
                  placeholder="Quantity">
              </div>
              <div [formGroupName]="i" class="col-md-3">
                <input 
                  formControlName="price" 
                  type="number" 
                  class="form-control" 
                  placeholder="Price">
              </div>
              <div class="col-md-3" style="margin-top: -12px;">
                <button type="button" class="btn btn-danger" (click)="removeSize(i)">Remove</button>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-primary" (click)="addSize()">Add Size</button>
        </div>
      
        <button type="submit" class="btn btn-success" [disabled]="!clothProductForm.valid">Save Product</button>
      </form>

  </div>
