
  <div class="container">
    <form [formGroup]="clothProductForm" (ngSubmit)="saveProduct()" class="container mt-4">

        <div class="row">

            <div class="col-md-4 mb-3">
              <label for="code" class="form-label">Code Modèle</label>
              <input 
              formControlName="code" 
              id="code" 
              type="text" 
              class="form-control" 
              placeholder="Code du Modèle">
            </div>

            <div class="col-md-4 mb-3">
                <label for="name" class="form-label">Nom De L'Article</label>
                <input 
                formControlName="name" 
                id="name" 
                type="text" 
                class="form-control" 
                placeholder="Nom du modèle">
                <div *ngIf="clothProductForm.get('name')?.invalid && clothProductForm.get('name')?.touched" class="text-danger">
                    Nom obligatoire
                </div>
            </div>
      
            <div class="col-md-4 mb-3">
                <label for="brand" class="form-label">Marque</label>
                <input 
                formControlName="brand" 
                id="brand" 
                type="text" 
                class="form-control" 
                placeholder="Marque du modèle">
            </div>

            

        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description De L'Article</label>
          <textarea 
            formControlName="description" 
            id="description" 
            class="form-control" 
            placeholder="Description du modèle"></textarea>
          <div *ngIf="clothProductForm.get('description')?.invalid && clothProductForm.get('description')?.touched" class="text-danger">
            Description obligatoire
          </div>
        </div>

      
        <div class="row">
          <div class="col-md-3 mb-3">
            <label for="discount" class="form-label">Reduction (%)</label>
            <input 
              formControlName="discount" 
              id="discount" 
              type="number" 
              class="form-control" 
              placeholder="Entre 0 et 100%">
            <div *ngIf="clothProductForm.get('discount')?.invalid && clothProductForm.get('discount')?.touched" class="text-danger">
              Entre 0 et 100
            </div>
          </div>
      
          <div class="col-md-3 mb-3">
            <label for="sex" class="form-label">Sexe</label>
            <select formControlName="sex" id="sex" class="form-select">
              <option value="MALE">Garçon</option>
              <option value="FEMALE">Fille</option>
              <option value="UNISEX">Unisex</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="category" class="form-label">Categorie</label>
            <input 
              formControlName="category" 
              id="category" 
              type="text" 
              class="form-control" 
              placeholder="Entrer la Categorie">
          </div>

          <div class="col-md-3">
            <label for="color" class="form-label">Couleur</label>
            <input 
              formControlName="color" 
              id="color" 
              type="text" 
              class="form-control" 
              placeholder="Entrer la Couleur">
          </div>

        </div>

      
        <div class="mb-3">
          <label for="sizes" class="form-label">Sizes</label>
          <div formArrayName="sizes">
            <div *ngFor="let size of sizes.controls; let i = index" class="row mb-2 d-flex justify-content-center">
              <div [formGroupName]="i" class="col-md-2">
                <input 
                  formControlName="name" 
                  type="text" 
                  class="form-control" 
                  placeholder="Taille (e.g. S, M, L)">
              </div>
              <div [formGroupName]="i" class="col-md-2">
                <input 
                  formControlName="quantity" 
                  type="number" 
                  class="form-control" 
                  placeholder="Quantité Store"><br>
                  <input style="margin-top: -30px;"
                  formControlName="magasin" 
                  type="number" 
                  class="form-control" 
                  placeholder="Quantité Magasin">
              </div>
              <div [formGroupName]="i" class="col-md-2">
                <input 
                  formControlName="price" 
                  type="number" 
                  class="form-control" 
                  placeholder="Prix">
              </div>
              <div [formGroupName]="i" class="col-md-2">
                <input 
                  formControlName="location" 
                  type="text" 
                  class="form-control" 
                  placeholder="Emplacement">
              </div>
              <div class="col-md-2" style="margin-top: -12px;">
                <button type="button" class="btn btn-danger" (click)="removeSize(i)">Eliminer</button>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-primary" (click)="addSize()">Ajouter une Taille</button>
        </div>

        <h5 class="mt-3">Ajouter Une Photo</h5>
        <input class="text-center" type="file" #myFile name="filename" (change)="onFileSelected($event)" accept="image/png, image/gif, image/jpeg">
      
        <button type="submit" class="btn btn-success" [disabled]="!clothProductForm.valid">Sauvegarder Le Modèle</button>
      </form>


  </div>
