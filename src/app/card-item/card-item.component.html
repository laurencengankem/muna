<div class="product-tile h-100">
    <div class="card h-100 border-0 shadow-sm product-tile-card" (click)="viewDetails()">
        <!-- Optional Heart Icon -->
        <!-- <a (click)="changeHeartColor()" id={{item.name}} class="position-absolute top-0 end-0 p-2">
            <i class='far fa-heart' style='font-size:24px;'></i>
        </a> -->
        <div class="product-tile-image-wrap">
            <img
                class="product-tile-image"
                src="{{picture}}"
                alt="Card image cap"
            >
            <span class="badge bg-danger product-tile-badge" *ngIf="item.discount > 0">-{{item.discount}}%</span>
        </div>
        <div class="card-body d-flex flex-column">
            <p class="product-tile-meta text-muted mb-1">{{item.category}} <strong>{{item.brand}}</strong></p>
            <h3 class="product-tile-title">{{item.name}}</h3>
            <p class="product-tile-meta text-muted mb-2">Code Modèle: {{item.code}}</p>

            <div class="mt-auto">
                <div *ngIf="item.discount > 0">
                    <span class="product-tile-price-old">{{item.sizes[0].price | customCurrency}}</span>
                    <span class="product-tile-price">{{item.sizes[0].price * (1 - item.discount / 100) | customCurrency }}</span>
                </div>
                <div *ngIf="item.discount == 0">
                    <span class="product-tile-price">{{item.sizes[0].price | customCurrency }}</span>
                </div>

                <button type="submit" class="btn btn-success btn-sm w-100 mt-2" (click)="viewDetails(); $event.stopPropagation()">Détails</button>
            </div>
        </div>
    </div>
</div>
