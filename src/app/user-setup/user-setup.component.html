<div class="component-body">

    <div class="container mt-5 p-5 pt-1">
        <div class="row">
          <div class="col-12">
            <h2 class="text-center mb-4">Gestion Utilisateurs</h2>
            <div class="table-responsive">
              <table class="table table-striped table-bordered">
                <thead class="table-primary">
                  <tr>
                    <th>Utilisateur</th>
                    <th>Role</th>
                    <th>Créé</th>
                    <th>modifié</th>
                    <th>Statut</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let user of users">
                    <td>{{ user.username }}</td>
                    <td>{{ user.role }}</td>
                    <td>{{ user.createdOn | date: 'medium' }}</td>
                    <td>{{ user.updatedOn | date: 'medium' }}</td>
                    <td>{{user.status=='ACTIVE'? 'Activé':'Désactivé'}}</td>
                    <td>
                      <button 
                        [ngClass]="user.status=='ACTIVE' ? 'btn btn-danger btn-sm': 'btn btn-success btn-sm'"
                        (click)="switchUserStatus(user)">
                        {{ user.status=='ACTIVE'? 'Desactiver':'Activer'}}
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      
</div>
