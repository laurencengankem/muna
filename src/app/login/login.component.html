<div class="component-body">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0 my-4 my-md-5">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <i class="bi bi-person-circle" style="font-size: 3rem;"></i>
              <h1 class="page-title mt-2 mb-0">Connexion</h1>
            </div>

            <div id="errorLogin" *ngIf="error" class="alert alert-danger d-flex align-items-center" role="alert">
              <i class="bi bi-exclamation-circle me-2"></i>
              <span>*Incorrect Username or Password!</span>
            </div>

            <form (ngSubmit)="log()" [formGroup]="form">
              <div class="mb-3">
                <label for="uname" class="form-label">Nom Utilisateur</label>
                <input type="text" class="form-control" placeholder="Enter Username" name="uname" id="uname" formControlName="username">
              </div>

              <div class="mb-3">
                <label for="psw" class="form-label">Mot De Passe</label>
                <input type="password" class="form-control" placeholder="Enter Password" name="psw" id="psw" formControlName="password">
              </div>

              <button type="submit" class="btn btn-success w-100">Login</button>
            </form>

            <div class="d-flex justify-content-between mt-3">
              <a routerLink="/register" class="link-success">S'enregistrer</a>
              <a routerLink="/password/reset" class="link-success">Mot de Passe Oublié?</a>
            </div>

            <button type="button" class="btn btn-outline-secondary w-100 mt-4" href="javascript:void(0)" [routerLink]="['/home']">Cancel</button>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
