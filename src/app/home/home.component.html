<div *ngIf="userRole == 'ADMIN' || userRole == 'USER' || userRole==''" class="component-body">
    <div id="carouselExample" class="carousel slide d-none d-md-block" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/img4.jpg" class="d-block w-100" alt="Image 1">
            </div>
            <div class="carousel-item">
                <img src="images/img6.jpg" class="d-block w-100" alt="Image 2">
            </div>
            <div class="carousel-item">
                <img src="images/img5.jpg" class="d-block w-100" alt="Image 3">
            </div>
        </div>
    </div>

    <div class="msg-accueil">
        <div class="img-accueil"></div>
        <button class="msg-btn" (click)="viewProducts()">Decouvrez les dernieres sorties</button>
    </div>

</div>


<div *ngIf="userRole == 'OPERATOR'" class="component-body" style="background-image: none;">
    <div class="container mt-5 p-3">
        <div class="row justify-content-center">
          <div class="col-12 text-center p-3">
            <a class="btn btn-primary form-control" href="checkout/indirect">Recherche Produit</a>
          </div>
          <div class="col-12 text-center p-3">
            <a class="btn btn-secondary form-control" href="checkout/direct">Caisse</a>
          </div>
          <div class="col-12 text-center p-3">
            <a class="btn btn-success form-control" href="orderList">Liste Des Commandes</a>
          </div>
          <div class="col-12 text-center p-3">
            <a class="btn btn-warning form-control text-white" href="catalog">Catalogue</a>
          </div>
        </div>
      </div>
</div>
