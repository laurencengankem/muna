<div class="component-body">
<div id="item-details" *ngIf="b">
<div id="images">
         <!-- Container for the image gallery -->
<div class="container" >

    <!-- Full-width images with number text -->
    <div class="mySlide" *ngIf="b" id="first">
      <div *ngIf="item.pictures.length>0 && b" class="numbertext" style="color: green;"> 1 / {{item.pictures.length}}</div>
      <img *ngIf="item.pictures.length>0" src={{item.pictures[0].url}} style="width:100%">
      <img *ngIf="item.pictures.length==0" src="" style="width:100%">
    </div>

    <div class="mySlides"   *ngFor="let pic of item.pictures; let i=index">
      <div class="numbertext"> {{i+1}} / {{item.pictures.length}}</div>
        <img src={{pic.url}} style="width:100%">
    </div>

  
  
    <!-- Next and previous buttons -->
    <a class="prev" (click)="plusSlides(-1)" *ngIf="item.pictures.length>1 && b" style="text-decoration: none;">&#10094;</a>
    <a class="next" (click)="plusSlides(1)"  *ngIf="item.pictures.length>1 && b" style="text-decoration: none;">&#10095;</a>
  
    <!-- Image text -->
    <div class="caption-container">
      <p id="caption"></p>
    </div>
  
    <!-- Thumbnail images -->
    <div class="row" >
       <div class="column" *ngFor="let pic of item.pictures; let i=index">
        <img class="demo cursor" src={{pic.url}} style="width:100%" (click)="currentSlide(i+1)" alt={{item.name}}>
      </div>
    </div>
  </div>    
</div>




    <div id="details" *ngIf="b" class="d-flex justify-content-center align-items-center">
        <div>
            <p>Prix: 
            <em *ngIf="d" style="text-decoration:line-through;color:grey">{{price | currency}}</em> &nbsp;
            <strong>{{price*(1- item.discount/100) | currency }}</strong><br>
            <em *ngIf="d" style="color:red">Réduction:{{item.discount}}%</em>
            </p>
            <p>{{item.category}}</p>
            <p>Description: <strong>{{item.description}}</strong> </p>

            <div>
              <label for="size-select">*Choisir Une Taille &nbsp; </label>
              <select id="size-select" [(ngModel)]="selectedSize" (change)="onSizeChange($event)" style="width: 70px;">
                <option *ngFor="let size of item.sizes" [value]="size.name" [disabled]="size.quantity === 0">
                  {{ size.name }}
                </option>
              </select>
            </div>

            <form (ngSubmit)="addItem()">
                <input *ngIf="userRole != 'ADMIN' && userRole != 'OPERATOR'" class="btn btn-success form-control mt-5" type="submit" id="addButton"  value="Ajouter Au Chariot" [disabled]="selectedSize==''"> 
            </form> 
            
        </div>
    </div>
</div>


</div>
