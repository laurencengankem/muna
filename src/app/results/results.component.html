<div class="component-body">
  <div class="container-fluid px-lg-4">

    <div id="cnx" *ngIf="error" class="empty-state">
      <i class="bi bi-wifi-off"></i>
      <p class="fw-bold">Check your internet connection</p>
    </div>

    <div id="found" style="display: none;" class="text-center text-muted py-5">
      <i class="bi bi-search fs-1"></i>
      <p class="fw-bold mb-0">No results found</p>
    </div>

    <div *ngIf="b && !error" class="row">

      <!-- Filters: persistent sidebar on desktop (d-lg-block), collapsible
           drawer on mobile driven by the existing showFilters/toggleContent()
           binding (unchanged) -->
      <aside class="col-lg-3 col-xl-2 mb-3 mb-lg-0">
        <button type="button" class="btn btn-dark w-100 d-lg-none mb-2" (click)="toggleContent()" [attr.aria-expanded]="showFilters" aria-controls="phn">
          <i class="bi bi-funnel me-1"></i>Filtres
        </button>

        <div id="phn" class="collapse d-lg-block" [class.show]="showFilters">
          <p class="section-title d-none d-lg-block">Filtrer par</p>
          <div class="accordion" id="filterAccordion">

            <div class="accordion-item" *ngIf="filtered.length>0">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" [ngClass]="{'text-success fw-semibold': priceFlag}" type="button" data-bs-toggle="collapse" data-bs-target="#filterPrice">Prix</button>
              </h2>
              <div id="filterPrice" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <form [formGroup]="priceForm" (submit)="filterProducts()">
                    <div class="d-flex align-items-center gap-2 mb-2">
                      <label class="form-label mb-0">De</label>
                      <input type="number" class="form-control form-control-sm" style="width:100px" formControlName="from" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');">
                    </div>
                    <div class="d-flex align-items-center gap-2 mb-3">
                      <label class="form-label mb-0">à</label>
                      <input type="number" class="form-control form-control-sm" style="width:100px" formControlName="to" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');">
                    </div>
                    <input type="submit" value="save" class="btn btn-success btn-sm w-100">
                  </form>
                </div>
              </div>
            </div>

            <div class="accordion-item" *ngIf="categories.length>0">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" [ngClass]="{'text-success fw-semibold': categoryFlag}" type="button" data-bs-toggle="collapse" data-bs-target="#filterCategory">Categorie</button>
              </h2>
              <div id="filterCategory" class="accordion-collapse collapse">
                <div class="accordion-body" (submit)="filterProducts()">
                  <form [formGroup]="categoryForm">
                    <div style="max-height: 200px; overflow-y: auto;" class="mb-2">
                      <div class="form-check" *ngFor="let cat of categories">
                        <label class="form-check-label">
                          <input type="checkbox" class="form-check-input" name="{{cat}}" [value]="cat" (change)="onCheckboxGenericChange($event,categoryForm)"> {{cat}}
                        </label>
                      </div>
                    </div>
                    <div class="d-flex gap-2">
                      <input type="submit" value="save" class="btn btn-success btn-sm flex-fill">
                      <input type="reset" value="reset" class="btn btn-outline-secondary btn-sm flex-fill">
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <div class="accordion-item" *ngIf="sizes.length>0">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" [ngClass]="{'text-success fw-semibold': sizeFlag}" type="button" data-bs-toggle="collapse" data-bs-target="#filterSize">Taille</button>
              </h2>
              <div id="filterSize" class="accordion-collapse collapse">
                <div class="accordion-body" (submit)="filterProducts()">
                  <form [formGroup]="sizeForm">
                    <div style="max-height: 200px; overflow-y: auto;" class="mb-2">
                      <div class="form-check" *ngFor="let size of sizes">
                        <label class="form-check-label">
                          <input type="checkbox" class="form-check-input" name="{{size}}" [value]="size" (change)="onCheckboxGenericChange($event,sizeForm)"> {{size}}
                        </label>
                      </div>
                    </div>
                    <div class="d-flex gap-2">
                      <input type="submit" value="save" class="btn btn-success btn-sm flex-fill">
                      <input type="reset" value="reset" class="btn btn-outline-secondary btn-sm flex-fill">
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <div class="accordion-item" *ngIf="brands.length>0">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" [ngClass]="{'text-success fw-semibold': brandFlag}" type="button" data-bs-toggle="collapse" data-bs-target="#filterBrand">Marque</button>
              </h2>
              <div id="filterBrand" class="accordion-collapse collapse">
                <div class="accordion-body" (submit)="filterProducts()">
                  <form [formGroup]="brandForm">
                    <div class="mb-2">
                      <div class="form-check" *ngFor="let brand of brands">
                        <label class="form-check-label">
                          <input type="checkbox" class="form-check-input" name="{{brand}}" [value]="brand" (change)="onCheckboxGenericChange($event,brandForm)"> {{brand}}
                        </label>
                      </div>
                    </div>
                    <div class="d-flex gap-2">
                      <input type="submit" value="save" class="btn btn-success btn-sm flex-fill">
                      <input type="reset" value="reset" class="btn btn-outline-secondary btn-sm flex-fill">
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <div class="accordion-item" *ngIf="colors.length>0">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" [ngClass]="{'text-success fw-semibold': colorFlag}" type="button" data-bs-toggle="collapse" data-bs-target="#filterColor">Couleur</button>
              </h2>
              <div id="filterColor" class="accordion-collapse collapse">
                <div class="accordion-body" (submit)="filterProducts()">
                  <form [formGroup]="colorForm">
                    <div style="max-height: 200px; overflow-y: auto;" class="mb-2">
                      <div class="form-check" *ngFor="let color of colors">
                        <label class="form-check-label">
                          <input type="checkbox" class="form-check-input" name="{{color}}" [value]="color" (change)="onCheckboxGenericChange($event,colorForm)"> {{color}}
                        </label>
                      </div>
                    </div>
                    <div class="d-flex gap-2">
                      <input type="submit" value="save" class="btn btn-success btn-sm flex-fill">
                      <input type="reset" value="reset" class="btn btn-outline-secondary btn-sm flex-fill">
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" [ngClass]="{'text-success fw-semibold': genreFlag}" type="button" data-bs-toggle="collapse" data-bs-target="#filterGenre">Sexe</button>
              </h2>
              <div id="filterGenre" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <form (ngSubmit)="filterProducts()">
                    <div class="mb-3">
                      <div class="form-check">
                        <input type="radio" class="form-check-input" [formControl]="genre" value="MALE" id="genre-male">
                        <label class="form-check-label" for="genre-male">Garçon</label>
                      </div>
                      <div class="form-check">
                        <input type="radio" class="form-check-input" [formControl]="genre" value="FEMALE" id="genre-female">
                        <label class="form-check-label" for="genre-female">Fille</label>
                      </div>
                    </div>
                    <div class="d-flex gap-2">
                      <button type="submit" class="btn btn-success btn-sm flex-fill">Save</button>
                      <button type="reset" (click)="genre.reset()" class="btn btn-outline-secondary btn-sm flex-fill">Reset</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

          </div>
        </div>
      </aside>

      <!-- Results -->
      <div class="col-lg-9 col-xl-10">
        <div *ngIf="!error" class="d-flex justify-content-between align-items-center mb-3">
          <p id="numResult" class="mb-0 text-muted"> {{filtered!.length}} Modèles Trouvés </p>
        </div>

        <div class="row g-3">
          <div class="col-6 col-md-4 col-xl-3" *ngFor="let item of filtered | paginate: { itemsPerPage: 11, currentPage: page }">
            <app-card-item [item]="item"></app-card-item>
          </div>
        </div>

        <div class="text-center mt-4" *ngIf="filtered.length > 0">
          <pagination-controls (pageChange)="onPageChange($event)"></pagination-controls>
        </div>
      </div>

    </div>
  </div>
</div>
