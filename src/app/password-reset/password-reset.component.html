<div class="component-body">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0 my-4 my-md-5">
          <div class="card-body p-4 p-md-5">

            <h1 class="page-title text-center">Reset your password</h1>

            <div id="link-message" class="text-center mb-3"><p> </p></div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="text" name="email" id="email" [formControl]="fc" class="form-control" placeholder="Email Address">
            </div>

            <div class="d-grid mb-3">
              <button type="submit" (click)="getEmail()" class="btn btn-success">Request Reset Link</button>
            </div>

            <p class="text-center mb-0"><a routerLink="/login" class="link-success">Return to Log In</a></p>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
